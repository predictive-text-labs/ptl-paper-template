[project]
name = "rewrite-pipeline"
version = "0.1.0"
description = "Sentence-level rewrite pipeline: Gemini shortens, Claude Fable judges, splice back into the paper"
readme = "README.md"
authors = [
    { name = "Alex Pan", email = "alex@ptl.inc" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.0,<3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rewrite = "rewrite_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylatexenc>=2.10",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
